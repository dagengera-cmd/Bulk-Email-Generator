name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OutlookEmailAutomator" --hidden-import=win32timezone main.py

      - name: Upload OutlookEmailAutomator.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookEmailAutomator-Windows
          path: dist/OutlookEmailAutomator.exe
